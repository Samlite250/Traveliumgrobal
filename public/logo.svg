<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D" />
      <stop offset="35%" stop-color="#FFD700" />
      <stop offset="75%" stop-color="#E6B800" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
    <filter id="planeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- 1. CLEAN GLOBE WIREFRAME -->
  <!-- Outer Globe Boundary Circle -->
  <circle cx="50" cy="50" r="38" stroke="url(#goldGradient)" stroke-width="2.5" fill="none" opacity="0.75" />
  
  <!-- Equator Line -->
  <path d="M 12 50 Q 50 64 88 50" fill="none" stroke="url(#goldGradient)" stroke-width="1.8" opacity="0.6" />
  <path d="M 12 50 Q 50 36 88 50" fill="none" stroke="url(#goldGradient)" stroke-width="1.8" opacity="0.6" />

  <!-- Latitude Curve Lines -->
  <path d="M 19 32 Q 50 42 81 32" fill="none" stroke="url(#goldGradient)" stroke-width="1.2" opacity="0.4" />
  <path d="M 19 68 Q 50 58 81 68" fill="none" stroke="url(#goldGradient)" stroke-width="1.2" opacity="0.4" />

  <!-- Longitude Lines -->
  <path d="M 50 12 Q 70 50 50 88" fill="none" stroke="url(#goldGradient)" stroke-width="1.8" opacity="0.6" />
  <path d="M 50 12 Q 30 50 50 88" fill="none" stroke="url(#goldGradient)" stroke-width="1.8" opacity="0.6" />

  <!-- 2. DYNAMIC FLIGHT ORBIT TRAIL -->
  <path d="M 15 78 C 22 92, 60 92, 85 65" fill="none" stroke="url(#goldGradient)" stroke-width="2" stroke-dasharray="3 2" opacity="0.6" />

  <!-- 3. TEXTBOOK PASSENGER COMMERCIAL AIRPLANE (ASCENDING DIAGONALLY AT 45 DEGREES) -->
  <g filter="url(#planeGlow)">
    <path d="
      M 50 16 
      L 53 38 
      L 84 56 
      L 84 63 
      L 53 50 
      L 53 72 
      L 63 80 
      L 63 85 
      L 50 81 
      L 37 85 
      L 37 80 
      L 47 72 
      L 47 50 
      L 16 63 
      L 16 56 
      L 47 38 
      Z" 
      fill="url(#goldGradient)" 
      stroke="#0A192F" 
      stroke-width="1" 
      transform="rotate(45 50 50)" />
  </g>
</svg>
