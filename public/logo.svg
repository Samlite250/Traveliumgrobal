<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="traveliumGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176" />
      <stop offset="50%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#CAA21F" />
    </linearGradient>
    <linearGradient id="traveliumGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0.1" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Global Compass Outer Ring -->
  <circle cx="60" cy="60" r="48" stroke="url(#traveliumGold)" stroke-width="2.5" stroke-dasharray="8 4 2 4" opacity="0.4" />
  
  <!-- Global Latitude / Longitude Ellipses -->
  <ellipse cx="60" cy="60" rx="46" ry="18" stroke="url(#traveliumGold)" stroke-width="2.5" transform="rotate(-28 60 60)" opacity="0.85" />
  <ellipse cx="60" cy="60" rx="18" ry="46" stroke="url(#traveliumGold)" stroke-width="1.8" transform="rotate(-28 60 60)" opacity="0.4" />

  <!-- Dynamic Swoosh Flight Trail -->
  <path d="M 18 82 C 25 58, 48 34, 84 26" stroke="url(#traveliumGlow)" stroke-width="4" stroke-linecap="round" />

  <!-- Supersonic Luxury Jet Silhouette -->
  <g filter="url(#goldGlow)">
    <path d="M 94 20 
             C 96 18, 97 19, 95 23 
             L 76 52 
             C 74 55, 71 55, 68 53 
             L 54 42 
             L 38 48 
             C 36 49, 35 48, 36 46 
             L 46 34 
             L 44 26 
             C 44 24, 46 24, 48 25 
             L 60 33 
             L 82 22 
             Z" 
          fill="url(#traveliumGold)" />
  </g>

  <!-- North Star / Luxury Sparkle Accent -->
  <polygon points="94,10 96,16 102,18 96,20 94,26 92,20 86,18 92,16" fill="url(#traveliumGold)" />
</svg>
