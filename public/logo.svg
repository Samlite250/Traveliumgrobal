<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="planeGlobeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D" />
      <stop offset="40%" stop-color="#FFD700" />
      <stop offset="80%" stop-color="#E6B800" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
    <filter id="planeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 1. DETAILED GLOBE STRUCTURE -->
  <!-- Globe Outer Boundary Circle -->
  <circle cx="60" cy="60" r="44" stroke="url(#planeGlobeGold)" stroke-width="3" opacity="0.9" />

  <!-- Equator Line -->
  <ellipse cx="60" cy="60" rx="44" ry="14" stroke="url(#planeGlobeGold)" stroke-width="1.8" opacity="0.6" />

  <!-- Upper & Lower Latitude Lines -->
  <ellipse cx="60" cy="40" rx="38" ry="10" stroke="url(#planeGlobeGold)" stroke-width="1.5" opacity="0.45" />
  <ellipse cx="60" cy="80" rx="38" ry="10" stroke="url(#planeGlobeGold)" stroke-width="1.5" opacity="0.45" />

  <!-- Prime Meridian & Longitude Curved Grid -->
  <ellipse cx="60" cy="60" rx="18" ry="44" stroke="url(#planeGlobeGold)" stroke-width="1.8" opacity="0.6" />
  <line x1="60" y1="16" x2="60" y2="104" stroke="url(#planeGlobeGold)" stroke-width="1.8" opacity="0.6" />

  <!-- 2. FLIGHT ORBITAL SWOOSH -->
  <path d="M 12 72 C 20 100, 75 105, 108 55" stroke="url(#planeGlobeGold)" stroke-width="3" stroke-dasharray="4 3" opacity="0.7" />

  <!-- 3. UNMISTAKABLE AIRPLANE SILHOUETTE (FLYING DIAGONALLY ACROSS GLOBE) -->
  <g filter="url(#planeShadow)">
    <!-- Main Airliner Fuselage, Wings, Tail Fin, Nose -->
    <path d="
      M 86 28 
      C 88 26, 91 27, 90 30 
      L 82 42 
      L 96 66 
      C 97 68, 96 69, 94 69 
      L 85 64 
      L 70 47 
      L 54 58 
      L 56 68 
      C 56 70, 54 71, 52 70 
      L 46 64 
      L 38 60 
      L 28 62 
      C 26 63, 25 61, 27 60 
      L 35 52 
      L 44 45 
      L 52 32 
      C 53 30, 55 30, 55 32 
      L 53 41 
      L 69 32 
      L 81 22 
      Z" 
      fill="url(#planeGlobeGold)" 
      stroke="#0A192F" 
      stroke-width="0.8" />
  </g>
</svg>
