  <!-- ═══ Primary SEO ═══ -->
  <title>Travelium Global | International Travel Agency — Study Abroad, Work Visas & Global Jobs</title>

    content="Travelium Global is a leading international travel & immigration agency. We help you study abroad, get work visas, find global jobs, win scholarships, and book flights — serving clients worldwide from East Africa." />
  <meta name="keywords"
    content="Travelium Global, traveliumglobal, traveliumglobal.com, www.traveliumglobal.com, international travel agency, travel agency East Africa, travel agency Rwanda, study abroad Rwanda, apply study abroad, study abroad 2025, working abroad application, work visa East Africa, jobs abroad Rwanda, work abroad Africa, visa services, travel agency, immigration consultant, immigration East Africa, scholarship East Africa, flight booking Africa, work in Dubai, work visa Dubai, work visa UK, work visa Canada, work visa Germany, traveling agency, traveling agency Rwanda, traveling agency in Rwanda, global jobs, job application abroad, abroad jobs Africa" />
  <meta name="author" content="Travelium Global" />
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

  <!-- ═══ Canonical URL ═══ -->

  <!-- ═══ Geo / Region Tags ═══ -->

    "url": "https://www.traveliumglobal.com",
    "logo": "https://www.traveliumglobal.com/logo.png",
    "image": "https://www.traveliumglobal.com/og-image.jpg",
    "description": "Travelium Global is an international travel and immigration agency offering study abroad programs, work visa assistance, global job placement, scholarships, and flight booking. We proudly serve clients in Rwanda, Uganda, Kenya, Tanzania, Burundi, and across the world.",
    "foundingDate": "2023",
    "areaServed": [
      { "@type": "Place", "name": "Worldwide" },
      { "@type": "Place", "name": "East Africa" },
      { "@type": "Place", "name": "Rwanda" },
      { "@type": "Place", "name": "Uganda" },
      { "@type": "Place", "name": "Kenya" },
      { "@type": "Place", "name": "Tanzania" },
      { "@type": "Place", "name": "Burundi" }

    "serviceType": [
      "Study Abroad Programs",
      "Work Visa Assistance",
      "International Job Placement",
      "Scholarship Applications",
      "Flight Booking",
      "Immigration Consulting"
    ],
    "contactPoint": {
      "@type": "ContactPoint",
      "contactType": "Customer Support",
      "availableLanguage": ["English", "French", "Kinyarwanda"],

      "https://www.instagram.com/traveliumglobal",
      "https://www.linkedin.com/company/traveliumglobal",
      "https://twitter.com/traveliumglobal"

  <!-- ═══ JSON-LD: WebSite + Sitelinks Search Box ═══ -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Travelium Global",
    "url": "https://www.traveliumglobal.com",
    "description": "International travel agency — study abroad, work visas, global jobs, scholarships and flight booking.",
    "potentialAction": {
      "@type": "SearchAction",
      "target": {
        "@type": "EntryPoint",
        "urlTemplate": "https://www.traveliumglobal.com/jobs?q={search_term_string}"
      },
      "query-input": "required name=search_term_string"
    }
  }
  </script>
